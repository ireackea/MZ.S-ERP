# ENTERPRISE FIX: Phase 0.2 – Full Runtime Docker Proof - 2026-03-13
# // ENTERPRISE FIX: Final One-Click Production Launch v3 - 2026-02-27
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $scheme $strict_transport_security {
  https "max-age=31536000; includeSubDomains";
  default "";
}

upstream frontend_upstream {
  server frontend:80;
}

upstream backend_upstream {
  server backend:3001;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 20m;
  client_body_timeout 120s;
  keepalive_timeout 65;

  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security $strict_transport_security always;

  # B21 — the backup import, on its own.
  #
  # A backup archive carries the whole database as base64, so a 512 MB dump arrives
  # as a ~680 MB file. The 20m ceiling above is right for everything else here and
  # wrong for this: with it, an operator holding the only copy of their data cannot
  # put it back, and nginx answers 413 with an HTML page the interface renders into
  # a toast. A more specific `location` wins over the prefix one, so this raises the
  # ceiling for the import alone and nothing else.
  location = /api/backup/import {
    client_max_body_size 768m;
    proxy_request_buffering off;
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The upload is one long request, and buffering it first would mean the whole
    # archive exists twice on the proxy's disk before the backend sees it.
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
  }
  location /api/ {
    proxy_pass http://backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # FC-ITEM-IMPORT — raised from 60s. A 15,000-row import is a single request
    # that can legitimately take minutes; at 60s nginx closed the socket while
    # the backend kept inserting, so the operator saw a failure and the catalogue
    # grew anyway. frontend/nginx.frontend.conf declares the same values.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /socket.io/ {
    proxy_pass http://backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location / {
    proxy_pass http://frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
