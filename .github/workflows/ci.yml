name: Manual CI

# FC-QA-001 — the verification gate. It calls `npm run ci:verify` so this file and
# a developer's machine run exactly the same checks; a gate that only exists in
# YAML drifts from the tree and goes stale.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Verify (encoding, prisma, typecheck, tests, build, compose)
        run: npm run ci:verify
