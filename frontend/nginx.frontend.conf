# ENTERPRISE FIX: Phase 0.2 – Full Runtime Docker Proof - 2026-03-13
# ENTERPRISE FIX: Phase 0 – التنظيف الأساسي والأمان الحرج - 2026-03-13
server {
  listen 4173;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # FC-ITEM-IMPORT — these three were absent here, so nginx applied its own
  # defaults: a 1 MiB body limit and a 60 second proxy timeout. A 15,000-row
  # import measures about 4 MB, so `npm run deploy:prod` could not perform one at
  # all — it answered 413 with an nginx HTML page, and the SPA's error handler has
  # no 413 branch, so the operator saw that page rendered into a toast.
  # nginx.prod.conf:24-25 already declared 20m; this is the same stack's default
  # entry point, so the two must not disagree.
  client_max_body_size 20m;
  client_body_timeout 120s;

  # B21 — the backup import, on its own.
  #
  # A backup archive carries the whole database as base64, so a 512 MB dump arrives
  # as a ~680 MB file. The 20m ceiling above is right for everything else here and
  # wrong for this: with it, an operator holding the only copy of their data cannot
  # put it back, and nginx answers 413 with an HTML page the interface renders into
  # a toast. A more specific `location` wins over the prefix one, so this raises the
  # ceiling for the import alone and nothing else.
  location = /api/backup/import {
    client_max_body_size 768m;
    proxy_request_buffering off;
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The upload is one long request, and buffering it first would mean the whole
    # archive exists twice on the proxy's disk before the backend sees it.
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
  }
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A bulk import is one long request, not many. 300s is above the longest
    # legitimate single import and below nothing else in this product; the
    # backend's own transaction timeout is what actually bounds the work.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /socket.io/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ─────────────────────────────────────────────────────────────────────────
  # منع تخزين index.html في الـ cache — السبب: الملف يحمل مراجع لـ JS/CSS bundles
  # التي تتغير عند كل build. بدون هذا الـ header، يُقدّم المتصفح نسخاً قديمة
  # حتى بعد إعادة بناء الـ frontend وإعادة تشغيل الـ container.
  # ─────────────────────────────────────────────────────────────────────────
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri $uri/ /index.html;
  }
}

